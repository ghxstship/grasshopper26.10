name: GHXSTSHIP Design System Enforcement

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  enforce-design-system:
    name: Enforce GHXSTSHIP Design System
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Run GHXSTSHIP Design System Enforcement
        run: npm run design:enforce
        
      - name: Comment PR with violations (if any)
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## ❌ GHXSTSHIP Design System Violations Detected
              
              Your PR contains design system violations. Please fix them before merging.
              
              ### How to Fix
              
              1. Run \`npm run design:enforce\` locally to see all violations
              2. Follow the remediation guide in the output
              3. Use atomic components from \`@/components/atoms/\`
              4. Use only black, white, and greyscale colors
              5. Use Typography components instead of raw HTML elements
              
              ### Resources
              
              - [Design System Guide](/docs/GHXSTSHIP_DESIGN_SYSTEM.md)
              - [Atomic Design System](/docs/architecture/ATOMIC_DESIGN_SYSTEM.md)
              - [Design System README](/GHXSTSHIP_DESIGN_SYSTEM_README.md)
              
              **Zero tolerance policy**: All violations must be fixed before merge.`
            })
